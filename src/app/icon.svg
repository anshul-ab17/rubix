<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="cubeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#cubeShadow)">
    <!-- Top Face (White / Light Slate) -->
    <polygon points="50,12 62,18 50,24 38,18" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="62,18 74,24 62,30 50,24" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="74,24 86,30 74,36 62,30" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />

    <polygon points="38,18 50,24 38,30 26,24" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="50,24 62,30 50,36 38,30" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="62,30 74,36 62,42 50,36" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />

    <polygon points="26,24 38,30 26,36 14,30" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="38,30 50,36 38,42 26,36" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="50,36 62,42 50,48 38,42" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Left Face (Emerald Green) -->
    <polygon points="14,30 26,36 26,49 14,43" fill="#22C55E" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="26,36 38,42 38,55 26,49" fill="#16A34A" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="38,42 50,48 50,61 38,55" fill="#22C55E" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />

    <polygon points="14,43 26,49 26,62 14,56" fill="#16A34A" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="26,49 38,55 38,68 26,62" fill="#22C55E" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="38,55 50,61 50,74 38,68" fill="#15803D" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />

    <polygon points="14,56 26,62 26,75 14,69" fill="#22C55E" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="26,62 38,68 38,81 26,75" fill="#16A34A" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="38,68 50,74 50,87 38,81" fill="#22C55E" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Right Face (Scarlet Red / Orange) -->
    <polygon points="50,48 62,42 62,55 50,61" fill="#EF4444" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="62,42 74,36 74,49 62,55" fill="#DC2626" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="74,36 86,30 86,43 74,49" fill="#EF4444" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />

    <polygon points="50,61 62,55 62,68 50,74" fill="#DC2626" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="62,55 74,49 74,62 62,68" fill="#EF4444" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="74,49 86,43 86,56 74,62" fill="#B91C1C" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />

    <polygon points="50,74 62,68 62,81 50,87" fill="#EF4444" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="62,68 74,62 74,75 62,81" fill="#DC2626" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="74,62 86,56 86,69 74,75" fill="#EF4444" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
  </g>
</svg>
